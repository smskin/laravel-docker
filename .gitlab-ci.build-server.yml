stages:
  - Build
  - Deploy

variables:
  GIT_STRATEGY: clone
  GIT_CLEAN_FLAGS: -ffdx
  GIT_DEPTH: 1
  TIMEZONE: Europe/Moscow
  CONTAINER_NAME_DELIMITER: "-"

.printDockerInfo: &print-docker-info
  - echo $(pwd)
  - docker info
  - docker compose version

.cloneGitRepository: &clone-repository
  - cd $(dirname ${CI_PROJECT_DIR})
  - rm -rf ${CI_PROJECT_DIR} || true
  - mkdir -p ${CI_PROJECT_DIR}
  - git clone --depth ${GIT_DEPTH} --branch ${CI_COMMIT_REF_NAME} ${CI_REPOSITORY_URL} ${CI_PROJECT_DIR}

.dropSources: &drop-sources
  - cd $(dirname ${CI_PROJECT_DIR})
  - rm -rf ${CI_PROJECT_DIR} || true

.dockerRepoLogin: &docker-repo-login
  - docker login --username ${CI_DOCKER_REGISTRY_USER} --password ${CI_DOCKER_REGISTRY_PASSWORD} ${CI_DOCKER_REGISTRY}

.dockerRepoLogout: &docker-repo-logout
  - docker logout ${CI_DOCKER_REGISTRY}

Build:
  stage: Build
  tags:
    - CI
  script:
    - *print-docker-info
    - *clone-repository
    - *docker-repo-login
    - cd ${CI_PROJECT_DIR}/docker
    - docker compose -f docker-compose.yml -f docker-compose.ci.yml --progress=plain build platform
    - docker compose -f docker-compose.yml -f docker-compose.ci.yml --progress=plain build app
    - docker compose -f docker-compose.yml -f docker-compose.ci.yml --progress=plain build php-fpm nginx supervisor
    - docker compose -f docker-compose.yml -f docker-compose.ci.yml push
  after_script:
    - *docker-repo-logout
    - cd ${CI_PROJECT_DIR}/docker || true
    - docker compose -f docker-compose.yml -f docker-compose.ci.yml --profile install down --rmi local || true
    - docker compose -f docker-compose.yml -f docker-compose.ci.yml --profile install down --rmi all || true
    - *drop-sources
  when: manual

.AbstractDeploy:
  stage: Deploy
  script:
    - *print-docker-info
    - *clone-repository
    - *docker-repo-login
    - cd ${CI_PROJECT_DIR}/docker
    - docker compose -f docker-compose.yml -f docker-compose.ci.yml pull --include-deps
    - docker compose -f docker-compose.yml -f docker-compose.ci.yml up -d
    - docker compose -f docker-compose.yml -f docker-compose.ci.yml exec php-fpm php artisan migrate --force
  after_script:
    - *docker-repo-logout
    - docker image prune --all --force || true
  dependencies: [ ]
  when: manual
  needs: [ "Build" ]

DEV01 - Deploy:
  extends: .AbstractDeploy
  environment: dev01
  tags:
    - CD_DEV_01

PRODUCTION - Deploy:
  extends: .AbstractDeploy
  environment: production
  tags:
    - CD_PROD_01
